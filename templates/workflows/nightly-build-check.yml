# 目标路径:.github/workflows/nightly-build-check.yml
# 由 unif-design/.github 的 templates/ 同步而来 —— 各仓统一版本,不要单仓 drift。
#
# 仅下发给有 native 源码的仓(umeng / hms-scan):提早发现 upstream RN 升级导致的
# native 编译 breakage。对标 reanimated 的 nightly build-check。
#
# 【advisory canary —— 非 required check】:cron 触发,失败只通知不卡 PR。
# 镜像 ci.yml 的 build-ios / build-android(同 Xcode / JDK / turbo 任务),
# 但把 example app 的 react-native 升到 `next` dist-tag(RC 预发布)再构建。
#
# 【低噪音设计】:仅当 react-native 有 `next` tag(RC 窗口期)时才真正构建;
# 多数时间无 RC → detect 输出空 → build job 整体 skip(绿),不产生噪音红灯。
name: RN-next Build Check
on:
  schedule:
    # 每周日 18:00 UTC ≈ 周一 02:00 北京。canary 不需要每天。
    - cron: '0 18 * * 0'
  workflow_dispatch:
  pull_request:
    # 只在改本 workflow 时验证(非 required check,可安全加 paths)。
    paths:
      - '.github/workflows/nightly-build-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    # 防 fork 跑(只在 unif-design org 下执行)。
    if: github.repository_owner == 'unif-design'
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.tag.outputs.next }}
    steps:
      - name: Resolve react-native `next` dist-tag
        id: tag
        shell: bash
        run: |
          if npm view react-native dist-tags --json | grep -q '"next"'; then
            NEXT="$(npm view react-native dist-tags.next)"
            echo "react-native@next = $NEXT"
            echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          else
            echo "当前无 react-native@next(无 RC 窗口),跳过构建"
          fi

  build-ios:
    needs: detect
    if: needs.detect.outputs.next != ''
    runs-on: macos-26
    env:
      XCODE_VERSION: "26.5"
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Bump react-native to next
        env:
          RN_NEXT: ${{ needs.detect.outputs.next }}
        run: yarn up "react-native@$RN_NEXT"

      - name: Use appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install cocoapods
        run: |
          cd example
          bundle install
          bundle exec pod repo update --verbose
          bundle exec pod install --project-directory=ios

      - name: Build example for iOS
        run: yarn turbo run build:ios

  build-android:
    needs: detect
    if: needs.detect.outputs.next != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Bump react-native to next
        env:
          RN_NEXT: ${{ needs.detect.outputs.next }}
        run: yarn up "react-native@$RN_NEXT"

      - name: Install JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Build example for Android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: yarn turbo run build:android
