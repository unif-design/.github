# 目标路径:.github/dependabot.yaml
# 由 unif-design/.github 的 templates/ 同步而来 —— 这是「基础版」。
# sync-repo.sh 仅在目标仓【不存在】 dependabot.yaml 时创建,不覆盖已有的
# (各仓可加 repo 特化 group,如 camera 的 vision-camera / design 依赖分组,顺序敏感)。
version: 2
updates:
  # npm 依赖周更 —— 分组减少 PR 噪音
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      types:
        patterns:
          - '@types/*'
      react-native:
        patterns:
          - 'react-native'
          - 'react-native-*'
          - '@react-native/*'
          - '@react-native-community/*'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - '@eslint-*'
      jest:
        patterns:
          - 'jest'
          - 'jest-*'
          - '@jest/*'
      commitlint:
        patterns:
          - 'commitlint'
          - '@commitlint/*'
      release-it:
        patterns:
          - 'release-it'
          - '@release-it/*'

  # GitHub Actions 月更 —— 升级频率低,month 即可
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
